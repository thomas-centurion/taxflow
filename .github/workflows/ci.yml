name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit, E2E, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taxflow
          POSTGRES_USER: taxflow
          POSTGRES_PASSWORD: taxflow_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxflow -d taxflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: taxflow
      DATABASE_USER: taxflow
      DATABASE_PASSWORD: taxflow_ci_only
      E2E_DATABASE_NAME: taxflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate throwaway test secrets
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          SEED_USER_PASSWORD="Ci-$(openssl rand -hex 12)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$SEED_USER_PASSWORD"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "SEED_USER_PASSWORD=$SEED_USER_PASSWORD" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build, unit tests and E2E tests (taxflow_test)
        run: npm run test:ci

  frontend:
    name: Frontend (unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  production:
    name: Production images (Docker build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_NAME: taxflow
      DATABASE_USER: taxflow
      DATABASE_PASSWORD: taxflow_ci_only
      DATABASE_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          SEED_USER_PASSWORD="Ci-$(openssl rand -hex 12)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$SEED_USER_PASSWORD"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "SEED_USER_PASSWORD=$SEED_USER_PASSWORD" >> "$GITHUB_ENV"
      - name: Build and start the production stack
        run: docker compose --profile app up -d --build --wait
      - name: Smoke test (read-only)
        run: sh scripts/docker-smoke-test.sh http://localhost:8080
      - name: The demo seed refuses to run in production
        run: |
          if docker compose exec -T backend node dist/database/seed.js; then echo "The seed ran with NODE_ENV=production"; exit 1; fi
      - name: Demo seed and login through the web server
        run: |
          docker compose exec -T -e NODE_ENV=development backend node dist/database/seed.js
          curl -sf -X POST http://localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"admin@taxflow.local\",\"password\":\"$SEED_USER_PASSWORD\"}" -o /dev/null
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down -v
